<!-- ============================================================
     WASHCLUB — og/og-image.svg
     STATUS:    PLACEHOLDER — ekspor ke PNG 1200×630 sebelum launch
     SECTION:   Open Graph / Social Media Preview
     RATIO:     1.91:1  1200×630px (wajib untuk OG)
     FORMAT:    Ekspor ke PNG setelah logo final tersedia
     USAGE:     <meta property="og:image" content="...og-image.png">
     NOTE:      File ini adalah template SVG.
                Ekspor ke og-image.png (1200×630) sebelum launch.
                Gunakan logo dari /logo/washclub-white.png (embed jika perlu).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="WashClub — Laundry yang Jalan Sendiri. Mulai Rp99.000/bulan.">

  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E293B"/>
      <stop offset="60%"  stop-color="#0F2D4A"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="og-glow-left" cx="25%" cy="55%" r="45%">
      <stop offset="0%"   stop-color="#2D9CDB" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-right" cx="80%" cy="40%" r="40%">
      <stop offset="0%"   stop-color="#56CCF2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#56CCF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Glow overlays -->
  <rect width="1200" height="630" fill="url(#og-glow-left)"/>
  <rect width="1200" height="630" fill="url(#og-glow-right)"/>

  <!-- Subtle dot grid overlay -->
  <pattern id="dot-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="white" fill-opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Left side content -->

  <!-- Logo placeholder text (replace with actual logo embed when exporting) -->
  <!-- ⚠ Saat ekspor ke PNG: embed gambar logo/washclub-white.png di sini -->
  <rect x="60" y="60" width="200" height="48" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="160" y="92" text-anchor="middle" font-family="Poppins, sans-serif" font-size="22" font-weight="800" fill="white">WashClub</text>
  <!-- Note: replace above rect+text with: <image href="../logo/washclub-white.png" x="60" y="60" height="48"/> -->

  <!-- Divider line -->
  <line x1="60" y1="136" x2="260" y2="136" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Tagline overline -->
  <text x="60" y="186" font-family="Poppins, sans-serif" font-size="15" font-weight="600"
        fill="#56CCF2" letter-spacing="0.08em">LAUNDRY BERLANGGANAN OTOMATIS</text>

  <!-- Main headline -->
  <text x="60" y="254" font-family="Poppins, sans-serif" font-size="56" font-weight="800"
        fill="white" letter-spacing="-0.03em">Laundry yang</text>
  <text x="60" y="320" font-family="Poppins, sans-serif" font-size="56" font-weight="800"
        fill="white" letter-spacing="-0.03em">Jalan Sendiri.</text>

  <!-- Subheadline -->
  <text x="60" y="380" font-family="Poppins, sans-serif" font-size="22" fill="rgba(255,255,255,0.75)">
    Atur jadwal sekali. WashClub urus sisanya, otomatis.
  </text>

  <!-- CTA pill -->
  <rect x="60" y="420" width="280" height="48" rx="24" fill="#2D9CDB"/>
  <text x="200" y="450" text-anchor="middle" font-family="Poppins, sans-serif" font-size="17" font-weight="700" fill="white">
    Mulai dari Rp99.000/bulan →
  </text>

  <!-- Trust badges -->
  <g font-family="Poppins, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">
    <circle cx="72" cy="510" r="4" fill="#22C55E"/>
    <text x="86" y="515">Gratis antar jemput</text>
    <circle cx="252" cy="510" r="4" fill="#22C55E"/>
    <text x="266" y="515">Bisa batal kapan saja</text>
  </g>

  <!-- Right side: phone mockup placeholder -->
  <rect x="700" y="60" width="300" height="510" rx="40" fill="#0F172A" opacity="0.8"/>
  <rect x="712" y="72" width="276" height="486" rx="32" fill="#F8FBFF" opacity="0.05"/>
  <!-- Screen content hint -->
  <rect x="724" y="94" width="252" height="1" fill="rgba(255,255,255,0.1)"/>

  <!-- App UI hints (simplified) -->
  <rect x="730" y="110" width="240" height="72" rx="16" fill="#2D9CDB" opacity="0.7"/>
  <text x="850" y="142" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="white">Kamis, 10:00 AM</text>
  <text x="850" y="162" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">✓ Pickup Otomatis · Mingguan</text>

  <!-- Day pills hint -->
  <g>
    <rect x="730" y="200" width="32" height="32" rx="10" fill="rgba(255,255,255,0.08)"/>
    <rect x="770" y="200" width="32" height="32" rx="10" fill="#2D9CDB" opacity="0.8"/>
    <rect x="810" y="200" width="32" height="32" rx="10" fill="rgba(255,255,255,0.08)"/>
    <rect x="850" y="200" width="32" height="32" rx="10" fill="#2D9CDB" opacity="0.8"/>
    <rect x="890" y="200" width="32" height="32" rx="10" fill="rgba(255,255,255,0.08)"/>
    <rect x="930" y="200" width="32" height="32" rx="10" fill="#2D9CDB" opacity="0.6"/>
  </g>

  <!-- Status cards hint -->
  <rect x="730" y="252" width="240" height="36" rx="12" fill="rgba(34,197,94,0.2)"/>
  <text x="850" y="275" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">✓ Dijemput · Senin 09:00</text>
  <rect x="730" y="298" width="240" height="36" rx="12" fill="rgba(45,156,219,0.2)" stroke="#2D9CDB" stroke-width="1" opacity="0.5"/>
  <text x="850" y="321" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">⟳ Sedang Diproses · 65%</text>
  <rect x="730" y="344" width="240" height="36" rx="12" fill="rgba(255,255,255,0.05)"/>
  <text x="850" y="367" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">🚗 Estimasi: Kamis sore</text>

  <!-- Floating check badge (top right of phone) -->
  <circle cx="1020" cy="88" r="32" fill="#22C55E" opacity="0.9"/>
  <polyline points="1005,88 1017,100 1036,74" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- URL watermark -->
  <text x="1140" y="616" text-anchor="end" font-family="Poppins, sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">
    washclub.id
  </text>

  <!-- Placeholder notice -->
  <rect x="0" y="0" width="1200" height="24" fill="rgba(239,68,68,0.15)"/>
  <text x="600" y="16" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">
    [PLACEHOLDER] Ekspor file ini ke PNG 1200×630 sebagai og-image.png sebelum launch
  </text>
</svg>
