  <rect x="220" y="222" width="54" height="5" rx="2.5" fill="#E2E8F0"/>
  <!-- Big check badge -->
  <circle cx="275" cy="115" r="16" fill="#2D9CDB"/>
  <polyline points="267,115 272,120 283,108" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Card 3 (Family) — faded -->
  <rect x="330" y="130" width="110" height="180" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5" opacity="0.7"/>
  <text x="385" y="165" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Family</text>
  <text x="385" y="185" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="#CBD5E1">Rp329k</text>
  <text x="385" y="200" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" fill="#CBD5E1">/bulan</text>
  <circle cx="354" cy="220" r="3" fill="#E2E8F0"/>
  <rect x="362" y="218" width="60" height="5" rx="2.5" fill="#E2E8F0"/>
  <circle cx="354" cy="236" r="3" fill="#E2E8F0"/>
  <rect x="362" y="234" width="50" height="5" rx="2.5" fill="#E2E8F0"/>
  <circle cx="354" cy="252" r="3" fill="#E2E8F0"/>
  <rect x="362" y="250" width="55" height="5" rx="2.5" fill="#E2E8F0"/>

  <!-- Abstract hand (geometric) pointing at card 2 -->
