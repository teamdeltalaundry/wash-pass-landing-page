  <rect x="183" y="98" width="114" height="204" rx="17" fill="none" stroke="#56CCF2" stroke-width="1" opacity="0.5"/>
  <!-- Popular badge -->
  <rect x="203" y="88" width="74" height="20" rx="10" fill="#2D9CDB"/>
  <text x="240" y="101" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" font-weight="700" fill="white">★ Populer</text>
