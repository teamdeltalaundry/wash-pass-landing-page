<!-- ============================================================
     WASHCLUB — how-it-works/how-1-choose-plan.svg
     STATUS:    PLACEHOLDER — ganti dengan ilustrasi final
     SECTION:   How It Works — Step 1
     RATIO:     1:1  480×480px
     STYLE:     Flat · abstract hand selecting subscription plan card
     AI PROMPT:
       Minimal flat illustration of an abstract hand (geometric, no
       skin texture) selecting one of three floating subscription plan
       cards. Selected card glows with blue border (#2D9CDB) and a
       checkmark. Other two cards slightly faded gray. Cards show
       simplified price tags (Rp shapes). Colors: #2D9CDB selection
       highlight, white cards, light gray bg. Flat geometric startup
       illustration. Square. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
