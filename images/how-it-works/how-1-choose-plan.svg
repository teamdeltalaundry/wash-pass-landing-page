    <rect x="0" y="20" width="48" height="50" rx="12" fill="#2D9CDB" opacity="0.85"/>
    <!-- Fingers pointing up (index finger) -->
    <rect x="10" y="-18" width="12" height="42" rx="6" fill="#2D9CDB"/>
    <!-- Tap ripple effect -->
    <circle cx="16" cy="-4" r="18" fill="none" stroke="#2D9CDB" stroke-width="1.5" opacity="0.25"/>
    <circle cx="16" cy="-4" r="28" fill="none" stroke="#2D9CDB" stroke-width="1" opacity="0.12"/>
    <!-- Other fingers folded -->
    <rect x="24" y="6" width="10" height="26" rx="5" fill="#2D9CDB" opacity="0.75"/>
    <rect x="36" y="10" width="9" height="22" rx="4.5" fill="#2D9CDB" opacity="0.65"/>
  </g>

  <!-- Placeholder label -->
  <rect x="0" y="450" width="480" height="30" rx="0" fill="rgba(45,156,219,0.08)"/>
  <text x="240" y="470" text-anchor="middle"
