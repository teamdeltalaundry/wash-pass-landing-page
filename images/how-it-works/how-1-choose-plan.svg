  <!-- Card 1 (Solo) — faded -->
  <rect x="40"  y="130" width="110" height="180" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5" opacity="0.7"/>
  <text x="95"  y="165" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Solo</text>
  <text x="95"  y="185" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="#CBD5E1">Rp99k</text>
  <text x="95"  y="200" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" fill="#CBD5E1">/bulan</text>
  <!-- Feature dots -->
  <circle cx="64" cy="220" r="3" fill="#E2E8F0"/>
  <rect x="72" y="218" width="60" height="5" rx="2.5" fill="#E2E8F0"/>
  <circle cx="64" cy="236" r="3" fill="#E2E8F0"/>
  <rect x="72" y="234" width="50" height="5" rx="2.5" fill="#E2E8F0"/>
  <circle cx="64" cy="252" r="3" fill="#E2E8F0"/>
  <rect x="72" y="250" width="55" height="5" rx="2.5" fill="#E2E8F0"/>

  <!-- Card 2 (Couple) — SELECTED -->
  <rect x="185" y="100" width="110" height="200" rx="16" fill="white" stroke="#2D9CDB" stroke-width="2.5"/>
