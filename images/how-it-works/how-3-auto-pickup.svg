     RATIO:     1:1  480×480px
     STYLE:     Flat · electric scooter · laundry bag · auto loop icon
     AI PROMPT:
       Minimal flat illustration of a modern electric scooter (side
       view, geometric style) carrying a clean white laundry bag with
       a blue checkmark seal. Above the scooter, a circular repeat/auto
       icon (∞ loop arrow) in blue indicating automation. Small map pin
       icons showing route from apartment to laundry and back.
       Colors: #2D9CDB scooter accent, white laundry bag, light gray
       road, very light blue sky bg. Flat geometric startup illustration,
       urban lifestyle, no washing machine. Square. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 480" width="480" height="480"
     role="img" aria-label="[PLACEHOLDER] Ilustrasi laundry dijemput dan diantar otomatis">

  <rect width="480" height="480" rx="24" fill="#EBF5FF"/>

  <!-- Sky/road background -->
  <rect x="0"   y="0"   width="480" height="280" rx="24" fill="#F0F9FF" rx="24"/>
  <rect x="0"   y="270" width="480" height="210" rx="0" fill="#F8FBFF"/>
  <!-- Road -->
  <rect x="0" y="310" width="480" height="60" rx="0" fill="#E2E8F0"/>
  <rect x="0" y="334" width="480" height="4"  rx="0" fill="white" opacity="0.6"/>
  <!-- Road dashes -->
  <g fill="#CBD5E1">
    <rect x="40"  y="338" width="40" height="3" rx="1.5"/>
    <rect x="120" y="338" width="40" height="3" rx="1.5"/>
    <rect x="200" y="338" width="40" height="3" rx="1.5"/>
    <rect x="280" y="338" width="40" height="3" rx="1.5"/>
    <rect x="360" y="338" width="40" height="3" rx="1.5"/>
    <rect x="420" y="338" width="40" height="3" rx="1.5"/>
  </g>

  <!-- Buildings (left — apartment) -->
  <rect x="30"  y="200" width="50" height="110" rx="4" fill="#CBD5E1"/>
  <rect x="38"  y="210" width="12" height="14" rx="2" fill="#E0F7FE"/>
  <rect x="56"  y="210" width="12" height="14" rx="2" fill="#E0F7FE"/>
  <rect x="38"  y="232" width="12" height="14" rx="2" fill="#E0F7FE"/>
  <rect x="56"  y="232" width="12" height="14" rx="2" fill="#2D9CDB" opacity="0.4"/>
  <rect x="44"  y="254" width="20" height="46" rx="2" fill="#B0BEC5"/>
  <!-- Map pin left -->
  <circle cx="55" cy="188" r="10" fill="#2D9CDB"/>
  <text x="55" y="193" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" fill="white">A</text>

  <!-- Buildings (right — laundry drop point) -->
  <rect x="400" y="210" width="50" height="100" rx="4" fill="#CBD5E1"/>
  <rect x="408" y="220" width="10" height="12" rx="2" fill="#E0F7FE"/>
  <rect x="424" y="220" width="10" height="12" rx="2" fill="#E0F7FE"/>
  <rect x="408" y="240" width="10" height="12" rx="2" fill="#E0F7FE"/>
  <rect x="424" y="240" width="10" height="12" rx="2" fill="#2D9CDB" opacity="0.4"/>
  <rect x="414" y="262" width="22" height="48" rx="2" fill="#B0BEC5"/>
  <!-- Map pin right (laundry) -->
  <circle cx="425" cy="198" r="10" fill="#22C55E"/>
  <text x="425" y="203" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" fill="white">B</text>

  <!-- Route dotted line -->
  <line x1="65" y1="188" x2="415" y2="188" stroke="#2D9CDB" stroke-width="2" stroke-dasharray="8,5" opacity="0.35" stroke-linecap="round"/>

  <!-- Electric Scooter (geometric, side view) -->
  <g transform="translate(160, 276)">
    <!-- Body platform -->
    <rect x="20"  y="36" width="120" height="16" rx="6" fill="#2D9CDB"/>
    <!-- Handlebar stem -->
    <rect x="104" y="8"  width="8"  height="32" rx="4" fill="#1E293B" opacity="0.8"/>
    <!-- Handlebar -->
    <rect x="92"  y="8"  width="32" height="6"  rx="3" fill="#1E293B" opacity="0.7"/>
    <!-- Seat -->
    <rect x="30"  y="28" width="48" height="10" rx="5" fill="#334155"/>
    <!-- Front wheel -->
    <circle cx="122" cy="58" r="16" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.8"/>
    <circle cx="122" cy="58" r="5"  fill="#64748B"/>
    <!-- Rear wheel -->
    <circle cx="24"  cy="58" r="16" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.8"/>
    <circle cx="24"  cy="58" r="5"  fill="#64748B"/>
    <!-- Motor (rear) -->
    <rect x="12" y="44" width="20" height="12" rx="4" fill="#2D9CDB" opacity="0.7"/>
    <!-- Laundry bag on seat -->
    <rect x="36" y="8" width="44" height="22" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Bag handles -->
    <path d="M 44 8 Q 44 0 50 0 Q 56 0 56 8" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 60 8 Q 60 0 66 0 Q 72 0 72 8" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Checkmark seal on bag -->
    <circle cx="58" cy="20" r="8" fill="#2D9CDB"/>
    <polyline points="53,20 57,24 63,16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Auto loop icon (above scooter) -->
  <g transform="translate(218, 140)">
    <circle cx="24" cy="24" r="28" fill="rgba(45,156,219,0.10)"/>
    <!-- Refresh arrows -->
    <path d="M 12 24 A 12 12 0 1 1 24 36" stroke="#2D9CDB" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="10,32 12,24 18,28" fill="#2D9CDB"/>
    <path d="M 36 24 A 12 12 0 1 1 24 12" stroke="#2D9CDB" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="38,16 36,24 30,20" fill="#2D9CDB"/>
  </g>

  <!-- Auto label -->
  <rect x="160" y="100" width="160" height="26" rx="13" fill="rgba(45,156,219,0.12)"/>
  <text x="240" y="117" text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#2D9CDB">
