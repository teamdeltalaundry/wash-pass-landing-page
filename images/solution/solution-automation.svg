<!-- ============================================================
     WASHCLUB — solution/solution-automation.svg
     STATUS:    PLACEHOLDER — ganti dengan ilustrasi final
     SECTION:   Solution
     RATIO:     4:3 (landscape)  800×600px ideal
     STYLE:     Flat · automation loop · 3 floating cards · curved arrows
     AI PROMPT:
       Flat illustration showing an automation loop concept for a
       laundry service: three floating cards connected by curved arrows
       forming a cycle. Card 1: smartphone with calendar icon, label
       "Set Schedule Once". Card 2: abstract laundry package with
       sparkle icons, label "Auto Processed". Card 3: delivery scooter
       icon, label "Delivered to Your Door". Cards white with soft blue
       shadows, connected by blue gradient curved arrows. Background
       very soft blue #F0F9FF. Startup flat illustration, Stripe/Linear
       marketing style, no washing machine. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="[PLACEHOLDER] Ilustrasi automasi laundry WashClub — set once, auto forever">

  <defs>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D9CDB"/>
      <stop offset="100%" stop-color="#56CCF2"/>
    </linearGradient>
    <filter id="card-drop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2D9CDB" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="center-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9CDB"/>
      <stop offset="100%" stop-color="#56CCF2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="32" fill="#F0F9FF"/>

  <!-- Background glow -->
  <ellipse cx="400" cy="300" rx="280" ry="200" fill="radial-gradient(#56CCF2, transparent)" opacity="0.08"/>

  <!-- ── CARD 1: Atur Jadwal Sekali (left) ── -->
  <g filter="url(#card-drop)" transform="translate(60, 180)">
    <rect x="0" y="0" width="180" height="200" rx="24" fill="white"/>
    <!-- Icon box -->
    <rect x="20" y="20" width="60" height="60" rx="16" fill="rgba(45,156,219,0.10)"/>
    <!-- Smartphone icon simplified -->
    <rect x="34" y="30" width="32" height="40" rx="6" fill="#2D9CDB" opacity="0.8"/>
    <rect x="38" y="36" width="24" height="26" rx="3" fill="white" opacity="0.9"/>
    <!-- Calendar lines in phone -->
    <line x1="41" y1="42" x2="59" y2="42" stroke="#2D9CDB" stroke-width="1.5"/>
    <line x1="41" y1="47" x2="59" y2="47" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="41" y1="51" x2="52" y2="51" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Circle dot (home button) -->
    <circle cx="50" cy="64" r="3" fill="#2D9CDB" opacity="0.4"/>
    <!-- Step number -->
    <circle cx="150" cy="30" r="16" fill="rgba(45,156,219,0.10)"/>
    <text x="150" y="35" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#2D9CDB">01</text>
    <!-- Label -->
    <text x="20" y="106" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Atur Jadwal</text>
    <text x="20" y="122" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Sekali</text>
    <text x="20" y="148" font-family="Poppins, sans-serif" font-size="12" fill="#64748B" style="white-space:pre">Pilih hari &amp; waktu</text>
    <text x="20" y="164" font-family="Poppins, sans-serif" font-size="12" fill="#64748B">yang cocok buatmu.</text>
    <!-- Done badge -->
    <rect x="20" y="176" width="80" height="16" rx="8" fill="#DCFCE7"/>
    <text x="60" y="187" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" font-weight="600" fill="#15803d">✓ Satu kali saja</text>
  </g>

  <!-- ── CARD 2: Auto Diproses (center, raised) ── -->
  <g filter="url(#card-drop)" transform="translate(310, 120)">
    <rect x="0" y="0" width="180" height="220" rx="24" fill="url(#center-grad)"/>
    <!-- Center sparkle icon -->
    <circle cx="90" cy="62" r="30" fill="rgba(255,255,255,0.18)"/>
    <!-- Sparkle paths -->
    <path d="M90 42 L93 55 L106 52 L96 62 L106 72 L93 69 L90 82 L87 69 L74 72 L84 62 L74 52 L87 55 Z"
          fill="white" opacity="0.9"/>
    <!-- Step number -->
    <circle cx="156" cy="28" r="16" fill="rgba(255,255,255,0.2)"/>
    <text x="156" y="33" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="white">02</text>
    <!-- Labels (white on blue) -->
    <text x="20" y="118" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="white">Otomatis</text>
    <text x="20" y="134" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="white">Diproses</text>
    <text x="20" y="162" font-family="Poppins, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">Kami jemput, cuci</text>
    <text x="20" y="178" font-family="Poppins, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">dengan teliti.</text>
    <!-- Auto badge -->
    <rect x="20" y="196" width="80" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="60" y="207" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" font-weight="600" fill="white">↺ Setiap minggu</text>
  </g>

  <!-- ── CARD 3: Diantar Balik (right) ── -->
  <g filter="url(#card-drop)" transform="translate(560, 180)">
    <rect x="0" y="0" width="180" height="200" rx="24" fill="white"/>
    <!-- Scooter / truck icon simplified -->
    <rect x="20" y="20" width="60" height="60" rx="16" fill="rgba(45,156,219,0.10)"/>
    <!-- Simple delivery scooter -->
    <rect x="28" y="44" width="24" height="14" rx="3" fill="#2D9CDB" opacity="0.8"/>
    <rect x="52" y="49" width="14" height="9" rx="2" fill="#2D9CDB" opacity="0.7"/>
    <circle cx="34" cy="60" r="5" fill="#1E293B" opacity="0.5"/>
    <circle cx="60" cy="60" r="5" fill="#1E293B" opacity="0.5"/>
    <!-- Package on scooter -->
    <rect x="30" y="36" width="16" height="10" rx="3" fill="#56CCF2" opacity="0.8"/>
    <!-- Check on package -->
    <polyline points="32,41 34,43 40,38" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Step number -->
    <circle cx="150" cy="30" r="16" fill="rgba(45,156,219,0.10)"/>
    <text x="150" y="35" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#2D9CDB">03</text>
    <!-- Labels -->
    <text x="20" y="106" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Diantar</text>
    <text x="20" y="122" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#1E293B">ke Pintumu</text>
    <text x="20" y="148" font-family="Poppins, sans-serif" font-size="12" fill="#64748B">Bersih, rapi, tepat</text>
    <text x="20" y="164" font-family="Poppins, sans-serif" font-size="12" fill="#64748B">waktu setiap minggu.</text>
    <!-- Done badge -->
    <rect x="20" y="176" width="80" height="16" rx="8" fill="rgba(45,156,219,0.08)"/>
    <text x="60" y="187" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" font-weight="600" fill="#2D9CDB">Tanpa pickup</text>
  </g>

  <!-- ── Curved arrow: Card 1 → Card 2 ── -->
  <path d="M 240 268 Q 280 240 310 250"
        stroke="url(#arrow-grad)" stroke-width="2.5" fill="none"
        stroke-dasharray="8,4" stroke-linecap="round"/>
  <polygon points="308,244 318,252 306,258" fill="#56CCF2" opacity="0.8"/>

  <!-- ── Curved arrow: Card 2 → Card 3 ── -->
  <path d="M 490 258 Q 525 238 560 252"
        stroke="url(#arrow-grad)" stroke-width="2.5" fill="none"
        stroke-dasharray="8,4" stroke-linecap="round"/>
  <polygon points="558,246 568,254 556,260" fill="#56CCF2" opacity="0.8"/>

  <!-- ── Return curved arrow (Card 3 back to Card 1) — the loop ── -->
  <path d="M 650 380 Q 650 480 400 490 Q 150 490 150 380"
        stroke="#2D9CDB" stroke-width="2" fill="none"
        stroke-dasharray="6,5" stroke-linecap="round" opacity="0.4"/>
  <!-- Loop label -->
  <rect x="316" y="482" width="168" height="28" rx="14" fill="rgba(45,156,219,0.08)"/>
  <text x="400" y="500" text-anchor="middle"
        font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#2D9CDB">
    ↺ Berulang otomatis setiap minggu
  </text>

  <!-- Placeholder label -->
  <rect x="0" y="564" width="800" height="36" rx="0" fill="rgba(45,156,219,0.06)"/>
  <text x="400" y="586" text-anchor="middle"
        font-family="Poppins, sans-serif" font-size="11" fill="#2D9CDB" font-weight="500">
    [PLACEHOLDER] solution/solution-automation.svg — Ganti dengan ilustrasi final
  </text>
</svg>
