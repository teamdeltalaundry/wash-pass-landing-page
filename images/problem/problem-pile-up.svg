<!-- ============================================================
     WASHCLUB — problem/problem-pile-up.svg
     STATUS:    PLACEHOLDER — ganti dengan ilustrasi final
     SECTION:   Problem — Pain Point 4
     RATIO:     1:1  400×400px
     STYLE:     Flat · growing tower of clothes · overwhelmed figure
     AI PROMPT:
       Minimal flat illustration of a growing pile of abstract clothing
       shapes (geometric rectangles/circles representing folded clothes)
       stacking up like a tower, slightly leaning. Small abstract human
       figure looking up with arms raised in overwhelm. Colors: clothes
       in light blues and grays, #F8FBFF background. Abstract geometric,
       no realistic clothes detail, flat startup illustration.
       Square, transparent bg. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-label="[PLACEHOLDER] Ilustrasi laundry menumpuk dan overwhelming">

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="#EBF5FF"/>

  <!-- Floor line -->
  <rect x="40" y="330" width="320" height="4" rx="2" fill="#E2E8F0"/>

  <!-- Clothes pile — stacked geometric shapes (slightly leaning right) -->
  <!-- Base clothes (wide) -->
  <rect x="108" y="300" width="144" height="28" rx="8" fill="#94A3B8" transform="rotate(1, 180, 314)"/>
  <!-- Layer 2 -->
  <rect x="118" y="272" width="128" height="26" rx="8" fill="#CBD5E1" transform="rotate(-1.5, 182, 285)"/>
  <!-- Layer 3 (blue tint) -->
  <rect x="126" y="246" width="112" height="24" rx="8" fill="#93C5FD" opacity="0.8" transform="rotate(2, 182, 258)"/>
  <!-- Layer 4 -->
  <rect x="134" y="222" width="100" height="22" rx="8" fill="#E2E8F0" transform="rotate(-2, 184, 233)"/>
  <!-- Layer 5 (biru) -->
  <rect x="140" y="200" width="90" height="20" rx="8" fill="#56CCF2" opacity="0.6" transform="rotate(2.5, 185, 210)"/>
  <!-- Layer 6 -->
  <rect x="146" y="180" width="78" height="18" rx="8" fill="#CBD5E1" transform="rotate(-2, 185, 189)"/>
  <!-- Layer 7 (blue) -->
  <rect x="152" y="162" width="68" height="17" rx="8" fill="#2D9CDB" opacity="0.5" transform="rotate(3, 186, 170)"/>
  <!-- Layer 8 (top — wobbly) -->
  <rect x="158" y="146" width="56" height="15" rx="8" fill="#93C5FD" opacity="0.7" transform="rotate(-4, 186, 153)"/>
  <!-- Topmost piece (about to fall) -->
  <rect x="163" y="132" width="44" height="13" rx="7" fill="#E2E8F0" transform="rotate(6, 185, 138)"/>

  <!-- Small human figure (right side, looking up, arms raised) -->
  <!-- Body -->
  <ellipse cx="310" cy="290" rx="16" ry="22" fill="#2D9CDB" opacity="0.85"/>
  <!-- Head -->
  <circle cx="310" cy="258" r="18" fill="#2D9CDB"/>
  <!-- Arms raised -->
  <line x1="296" y1="278" x2="272" y2="248" stroke="#2D9CDB" stroke-width="10" stroke-linecap="round"/>
  <line x1="324" y1="278" x2="348" y2="248" stroke="#2D9CDB" stroke-width="10" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="304" y1="312" x2="298" y2="334" stroke="#2D9CDB" stroke-width="10" stroke-linecap="round"/>
  <line x1="316" y1="312" x2="322" y2="334" stroke="#2D9CDB" stroke-width="10" stroke-linecap="round"/>

  <!-- Exclamation / stress marks -->
  <text x="268" y="240" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#EF4444" opacity="0.7">!</text>
  <text x="348" y="242" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#EF4444" opacity="0.7">!</text>

  <!-- Small arrow indicating growth upward -->
  <line x1="80" y1="300" x2="80" y2="145" stroke="#2D9CDB" stroke-width="2" stroke-dasharray="5,4" opacity="0.4" stroke-linecap="round"/>
  <polyline points="74,150 80,138 86,150" fill="none" stroke="#2D9CDB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Placeholder label -->
  <rect x="0" y="370" width="400" height="30" rx="0" fill="rgba(45,156,219,0.08)"/>
  <text x="200" y="390" text-anchor="middle"
        font-family="Poppins, sans-serif" font-size="10" fill="#2D9CDB">
    [PLACEHOLDER] problem/problem-pile-up.svg
  </text>
