<!-- ============================================================
     WASHCLUB — problem/problem-no-time.svg
     STATUS:    PLACEHOLDER — ganti dengan ilustrasi final
     SECTION:   Problem — Pain Point 1
     RATIO:     1:1  400×400px
     STYLE:     Minimal flat · abstract human silhouette · exhausted
     AI PROMPT:
       Minimal flat illustration of an abstract human silhouette
       sitting exhausted at a desk with a laptop, clock showing late
       hour, pile of unfolded clothes visible in the background corner.
       Color: soft blue #EBF5FF bg, blue human shape #2D9CDB, light
       gray clothes pile. Abstract, no facial features, geometric,
       startup illustration style. Square, transparent bg. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-label="[PLACEHOLDER] Ilustrasi orang tidak punya waktu mencuci">

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="#EBF5FF"/>

  <!-- Desk -->
  <rect x="60" y="270" width="280" height="12" rx="4" fill="#CBD5E1"/>
  <rect x="80"  y="282" width="10" height="60" rx="3" fill="#CBD5E1"/>
  <rect x="310" y="282" width="10" height="60" rx="3" fill="#CBD5E1"/>

  <!-- Laptop screen -->
  <rect x="130" y="200" width="140" height="90" rx="8" fill="#1E293B"/>
  <rect x="136" y="206" width="128" height="78" rx="5" fill="#2D9CDB" opacity="0.15"/>
  <!-- Laptop keyboard base -->
  <rect x="120" y="290" width="160" height="8" rx="4" fill="#334155"/>
  <rect x="160" y="298" width="80" height="3" rx="2" fill="#475569"/>

  <!-- Clock on wall -->
  <circle cx="320" cy="140" r="36" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="320" cy="140" r="3" fill="#64748B"/>
  <!-- Hour hand (late — 11 o'clock) -->
  <line x1="320" y1="140" x2="307" y2="114" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="320" y1="140" x2="336" y2="122" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <!-- Clock ticks -->
  <circle cx="320" cy="108" r="2" fill="#CBD5E1"/>
  <circle cx="320" cy="172" r="2" fill="#CBD5E1"/>
  <circle cx="284" cy="140" r="2" fill="#CBD5E1"/>
  <circle cx="356" cy="140" r="2" fill="#CBD5E1"/>

  <!-- Abstract human figure (sitting, slouched) -->
  <!-- Body -->
  <ellipse cx="200" cy="230" rx="28" ry="36" fill="#2D9CDB" opacity="0.85"/>
  <!-- Head -->
  <circle cx="200" cy="185" r="22" fill="#2D9CDB"/>
  <!-- Head tilted/drooping — re-positioned -->
  <circle cx="206" cy="191" r="22" fill="#2D9CDB"/>
  <!-- Arms resting on desk -->
  <rect x="155" y="252" width="50" height="16" rx="8" fill="#2D9CDB" opacity="0.75" transform="rotate(-8, 180, 260)"/>
  <rect x="198" y="252" width="50" height="16" rx="8" fill="#2D9CDB" opacity="0.75" transform="rotate(8, 223, 260)"/>

  <!-- Clothes pile (background, bottom right) -->
  <g opacity="0.5">
    <ellipse cx="340" cy="330" rx="30" ry="14" fill="#94A3B8"/>
    <ellipse cx="348" cy="318" rx="22" ry="11" fill="#CBD5E1"/>
    <ellipse cx="335" cy="308" rx="18" ry="9"  fill="#E2E8F0"/>
    <ellipse cx="344" cy="300" rx="12" ry="7"  fill="#CBD5E1"/>
  </g>

  <!-- ZZZ (tired) -->
  <text x="230" y="170" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="#56CCF2" opacity="0.7">z</text>
  <text x="248" y="155" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#56CCF2" opacity="0.5">z</text>
  <text x="270" y="138" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#56CCF2" opacity="0.35">z</text>

  <!-- Placeholder label -->
  <rect x="0" y="370" width="400" height="30" rx="0" fill="rgba(45,156,219,0.08)"/>
  <text x="200" y="390" text-anchor="middle"
        font-family="Poppins, sans-serif" font-size="10" fill="#2D9CDB">
    [PLACEHOLDER] problem/problem-no-time.svg
  </text>
</svg>
