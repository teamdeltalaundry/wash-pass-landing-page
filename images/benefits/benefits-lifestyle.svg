<!-- ============================================================
     WASHCLUB — benefits/benefits-lifestyle.svg
     STATUS:    PLACEHOLDER — ganti dengan ilustrasi final
     SECTION:   Benefits (Kenapa WashClub)
     RATIO:     4:3  800×600px ideal
     STYLE:     Flat · urban apartment · figure relaxing · clean clothes
     AI PROMPT:
       Flat illustration of a clean modern apartment interior (minimal,
       geometric). Abstract human figure relaxing on a couch (reading
       or on phone), next to a neat pile of perfectly folded clean
       clothes on a side table. A delivery box with a checkmark near
       the door. Through the window, a city skyline silhouette.
       Colors: interior warm white and very light gray, #2D9CDB accents,
       soft shadows. Flat startup lifestyle illustration, urban minimal,
       similar to Airbnb or Notion illustrations. No washing machine.
       Landscape format. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="[PLACEHOLDER] Ilustrasi kehidupan urban santai berkat WashClub">

  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background room -->
  <rect width="800" height="600" rx="32" fill="#F8FBFF"/>

  <!-- Wall -->
  <rect x="0" y="0" width="800" height="380" rx="0" fill="#F1F5F9"/>
  <!-- Floor -->
  <rect x="0" y="368" width="800" height="232" rx="0" fill="#E8EFF8"/>
  <!-- Floor/wall divider (baseboard) -->
  <rect x="0" y="368" width="800" height="8" rx="0" fill="#CBD5E1"/>

  <!-- Window (left wall) -->
  <rect x="60" y="80" width="160" height="200" rx="8" fill="#DBEAFE"/>
  <rect x="60" y="80" width="160" height="200" rx="8" fill="none" stroke="#CBD5E1" stroke-width="3"/>
  <!-- Window frame cross -->
  <line x1="140" y1="80" x2="140" y2="280" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="60" y1="180" x2="220" y2="180" stroke="#CBD5E1" stroke-width="3"/>
  <!-- City skyline in window -->
  <g fill="#93C5FD" opacity="0.4">
    <rect x="72"  y="210" width="16" height="64" rx="2"/>
    <rect x="94"  y="195" width="20" height="79" rx="2"/>
    <rect x="120" y="220" width="14" height="54" rx="2"/>
    <rect x="140" y="205" width="18" height="69" rx="2"/>
    <rect x="164" y="215" width="20" height="59" rx="2"/>
    <rect x="188" y="225" width="14" height="49" rx="2"/>
  </g>

  <!-- Wall decoration (framed picture) -->
  <rect x="310" y="60" width="100" height="80" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="320" y="70" width="80" height="60" rx="4" fill="rgba(45,156,219,0.08)"/>
  <!-- Abstract art in frame -->
  <circle cx="360" cy="100" r="20" fill="none" stroke="#56CCF2" stroke-width="2" opacity="0.5"/>
  <circle cx="360" cy="100" r="10" fill="#2D9CDB" opacity="0.25"/>

  <!-- Couch -->
  <rect x="120" y="300" width="360" height="100" rx="20" fill="#CBD5E1" filter="url(#soft-shadow)"/>
  <!-- Couch back -->
  <rect x="120" y="270" width="360" height="52" rx="16" fill="#B8C5D4"/>
  <!-- Couch pillows -->
  <rect x="136" y="275" width="60" height="44" rx="12" fill="#93A3B8" opacity="0.9"/>
  <rect x="404" y="275" width="60" height="44" rx="12" fill="#93A3B8" opacity="0.9"/>
  <!-- Couch armrests -->
  <rect x="120" y="280" width="28" height="80" rx="12" fill="#B8C5D4"/>
  <rect x="452" y="280" width="28" height="80" rx="12" fill="#B8C5D4"/>

  <!-- Abstract human figure relaxing on couch -->
  <!-- Body (reclined) -->
  <ellipse cx="290" cy="310" rx="55" ry="22" fill="#2D9CDB" opacity="0.85"/>
  <!-- Head -->
  <circle cx="215" cy="295" r="22" fill="#2D9CDB"/>
  <!-- Arm up (using phone) -->
  <line x1="295" y1="300" x2="310" y2="268" stroke="#2D9CDB" stroke-width="12" stroke-linecap="round"/>
  <!-- Phone in hand -->
  <rect x="304" y="252" width="16" height="24" rx="4" fill="#1E293B" opacity="0.8"/>
  <rect x="307" y="255" width="10" height="16" rx="2" fill="#56CCF2" opacity="0.6"/>

  <!-- Side table -->
  <rect x="480" y="320" width="80" height="12" rx="4" fill="#E2E8F0"/>
  <rect x="492" y="332" width="8"  height="48" rx="3" fill="#CBD5E1"/>
  <rect x="556" y="332" width="8"  height="48" rx="3" fill="#CBD5E1"/>

  <!-- Neat pile of clean clothes on table -->
  <g transform="translate(490, 276)">
    <rect x="0"  y="30" width="60" height="12" rx="4" fill="#93C5FD" opacity="0.7"/>
    <rect x="4"  y="20" width="52" height="11" rx="4" fill="#E2E8F0"/>
    <rect x="8"  y="10" width="44" height="11" rx="4" fill="#DBEAFE"/>
    <rect x="12" y="2"  width="36" height="9"  rx="4" fill="#93C5FD" opacity="0.5"/>
    <!-- Folded clean label -->
    <rect x="0" y="44" width="60" height="16" rx="6" fill="rgba(34,197,94,0.12)"/>
    <text x="30" y="55" text-anchor="middle" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#15803d">✓ Bersih</text>
  </g>

  <!-- Delivery box near door (right side) -->
  <g transform="translate(640, 340)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="80" height="70" rx="8" fill="#F8FBFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Box tape -->
    <line x1="0" y1="35" x2="80" y2="35" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="70" stroke="#CBD5E1" stroke-width="2"/>
    <!-- WashClub check seal -->
    <circle cx="40" cy="35" r="16" fill="#2D9CDB" opacity="0.12" stroke="#2D9CDB" stroke-width="1.5"/>
    <polyline points="32,35 37,40 48,28" stroke="#2D9CDB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- WashClub label -->
    <text x="40" y="62" text-anchor="middle" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="#64748B">WashClub</text>
  </g>

  <!-- Door (right wall) -->
  <rect x="700" y="150" width="80" height="220" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="710" y="160" width="60" height="190" rx="4" fill="#F8FAFC"/>
  <!-- Door handle -->
  <circle cx="738" cy="265" r="5" fill="#CBD5E1"/>
  <rect x="730" y="262" width="16" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Rug / carpet on floor -->
  <ellipse cx="280" cy="400" rx="200" ry="30" fill="#2D9CDB" opacity="0.06"/>

  <!-- Placeholder label -->
  <rect x="0" y="564" width="800" height="36" rx="0" fill="rgba(45,156,219,0.06)"/>
  <text x="400" y="586" text-anchor="middle"
        font-family="Poppins, sans-serif" font-size="11" fill="#2D9CDB" font-weight="500">
    [PLACEHOLDER] benefits/benefits-lifestyle.svg — Ganti dengan ilustrasi final
  </text>
