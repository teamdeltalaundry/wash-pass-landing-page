<!-- ============================================================
     WASHCLUB — hero/hero-mockup-main.svg
     STATUS:    PLACEHOLDER — ganti dengan ilustrasi final
     SECTION:   Hero
     RATIO:     4:5 (portrait)  960×1200px ideal
     STYLE:     Flat illustration · smartphone mockup modern
                floating UI cards · biru #2D9CDB + white
     AI PROMPT (Recraft.ai / Adobe Firefly):
       Flat illustration of a modern thin-bezel smartphone floating
       at a slight angle, displaying a clean scheduling UI app screen
       with a weekly calendar, pickup time slots highlighted in blue
       (#2D9CDB), and a green checkmark badge labeled "Pickup
       Scheduled". Around the phone are small floating UI cards: one
       showing "Laundry Picked Up ✓" in white with a soft blue shadow,
       one showing a progress bar "Processing 60%", and one showing a
       delivery truck icon with "On the Way". Background transparent.
       Color palette: #2D9CDB, #56CCF2, #1E293B, white. Style: minimal
       flat UI illustration, Apple-inspired, startup modern. No washing
       machine. SVG style.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 600" width="480" height="600"
     role="img" aria-label="[PLACEHOLDER] Smartphone mockup jadwal pickup otomatis WashClub">

  <!-- Background blob -->
  <defs>
    <radialGradient id="blob-hero" cx="55%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#56CCF2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#56CCF2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2D9CDB" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-phone" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E293B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Glow blob -->
  <ellipse cx="300" cy="280" rx="200" ry="180" fill="url(#blob-hero)"/>

  <!-- Phone frame -->
  <g filter="url(#shadow-phone)" transform="translate(120, 60)">
    <rect x="0" y="0" width="240" height="480" rx="32" ry="32" fill="#1E293B"/>
    <!-- Screen -->
    <rect x="10" y="10" width="220" height="460" rx="24" ry="24" fill="#F8FBFF"/>
    <!-- Notch -->
    <rect x="85" y="14" width="70" height="10" rx="5" fill="#0F172A" opacity="0.6"/>

    <!-- App UI inside screen -->
    <!-- Header -->
    <text x="24" y="54" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Hi, Andi 👋</text>
    <text x="24" y="70" font-family="Poppins, sans-serif" font-size="9" fill="#64748B">Pickup berikutnya:</text>

    <!-- Pickup card (blue) -->
    <rect x="18" y="80" width="204" height="60" rx="14" fill="#2D9CDB"/>
    <rect x="18" y="80" width="204" height="60" rx="14" fill="url(#grad-blue)"/>
    <defs>
      <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2D9CDB"/>
        <stop offset="100%" stop-color="#56CCF2"/>
      </linearGradient>
    </defs>
    <!-- Calendar icon placeholder -->
    <rect x="28" y="93" width="20" height="20" rx="4" fill="rgba(255,255,255,0.25)"/>
    <line x1="31" y1="93" x2="31" y2="88" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="93" x2="45" y2="88" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="100" x2="48" y2="100" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <text x="58" y="100" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="white">Kamis, 10:00</text>
    <text x="58" y="114" font-family="Poppins, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">Otomatis · Mingguan</text>
    <!-- Check badge -->
    <circle cx="202" cy="110" r="10" fill="rgba(255,255,255,0.2)"/>
    <polyline points="196,110 200,114 208,106" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Weekly schedule -->
    <text x="24" y="162" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" letter-spacing="0.05em">JADWAL MINGGUAN</text>
    <!-- Day pills -->
    <g font-family="Poppins, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">
      <rect x="18"  y="170" width="24" height="28" rx="8" fill="#F1F5F9"/>
      <text x="30"  y="189" fill="#94A3B8">Sen</text>
      <rect x="48"  y="170" width="24" height="28" rx="8" fill="#2D9CDB"/>
      <text x="60"  y="189" fill="white">Sel</text>
      <rect x="78"  y="170" width="24" height="28" rx="8" fill="#F1F5F9"/>
      <text x="90"  y="189" fill="#94A3B8">Rab</text>
      <rect x="108" y="170" width="24" height="28" rx="8" fill="#2D9CDB"/>
      <text x="120" y="189" fill="white">Kam</text>
      <rect x="138" y="170" width="24" height="28" rx="8" fill="#F1F5F9"/>
      <text x="150" y="189" fill="#94A3B8">Jum</text>
      <rect x="168" y="170" width="24" height="28" rx="8" fill="#2D9CDB"/>
      <text x="180" y="189" fill="white">Sab</text>
      <rect x="198" y="170" width="24" height="28" rx="8" fill="#F1F5F9"/>
      <text x="210" y="189" fill="#94A3B8">Min</text>
    </g>

    <!-- Status cards -->
    <text x="24" y="220" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" letter-spacing="0.05em">STATUS LAUNDRY</text>
    <!-- Dijemput (done) -->
    <rect x="18" y="228" width="204" height="36" rx="10" fill="#DCFCE7"/>
    <circle cx="36" cy="246" r="9" fill="#22C55E"/>
    <polyline points="31,246 34,249 41,242" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="54" y="244" font-family="Poppins, sans-serif" font-size="9.5" font-weight="600" fill="#15803d">Dijemput</text>
    <text x="54" y="256" font-family="Poppins, sans-serif" font-size="8" fill="#16a34a" opacity="0.8">Senin, 09:00</text>

    <!-- Diproses (active) -->
    <rect x="18" y="270" width="204" height="36" rx="10" fill="rgba(45,156,219,0.08)"/>
    <circle cx="36" cy="288" r="9" fill="rgba(45,156,219,0.15)" stroke="#2D9CDB" stroke-width="1.5"/>
    <!-- Loader dots -->
    <circle cx="32" cy="288" r="1.5" fill="#2D9CDB"/>
    <circle cx="36" cy="288" r="1.5" fill="#2D9CDB" opacity="0.6"/>
    <circle cx="40" cy="288" r="1.5" fill="#2D9CDB" opacity="0.3"/>
    <text x="54" y="286" font-family="Poppins, sans-serif" font-size="9.5" font-weight="600" fill="#2D9CDB">Sedang Diproses</text>
    <!-- Progress bar -->
    <rect x="54" y="291" width="100" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="54" y="291" width="65"  height="4" rx="2" fill="#2D9CDB"/>
    <text x="160" y="296" font-family="Poppins, sans-serif" font-size="7.5" fill="#2D9CDB" font-weight="600">65%</text>

    <!-- Diantar (pending) -->
    <rect x="18" y="312" width="204" height="36" rx="10" fill="#F8FAFC"/>
    <circle cx="36" cy="330" r="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Truck simple -->
    <rect x="28" y="327" width="10" height="7" rx="1" fill="#CBD5E1"/>
    <rect x="38" y="330" width="7" height="4" rx="1" fill="#CBD5E1"/>
    <circle cx="31" cy="336" r="2" fill="#94A3B8"/>
    <circle cx="42" cy="336" r="2" fill="#94A3B8"/>
    <text x="54" y="328" font-family="Poppins, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">Diantar</text>
    <text x="54" y="340" font-family="Poppins, sans-serif" font-size="8" fill="#CBD5E1">Estimasi: Kamis</text>

    <!-- Bottom home indicator -->
    <rect x="90" y="454" width="60" height="4" rx="2" fill="#1E293B" opacity="0.15"/>
  </g>

  <!-- Floating card 1: Laundry Picked Up -->
  <g filter="url(#shadow-card)" transform="translate(14, 130)">
    <rect x="0" y="0" width="140" height="42" rx="12" fill="white"/>
    <circle cx="21" cy="21" r="12" fill="#DCFCE7"/>
    <polyline points="15,21 19,25 27,16" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="40" y="18" font-family="Poppins, sans-serif" font-size="8.5" font-weight="600" fill="#1E293B">Laundry Dijemput</text>
    <text x="40" y="30" font-family="Poppins, sans-serif" font-size="7.5" fill="#64748B">Hari ini · 09:00</text>
  </g>

  <!-- Floating card 2: On the Way -->
  <g filter="url(#shadow-card)" transform="translate(298, 360)">
    <rect x="0" y="0" width="140" height="42" rx="12" fill="white"/>
    <circle cx="21" cy="21" r="12" fill="rgba(45,156,219,0.10)"/>
    <!-- Small truck icon -->
    <rect x="12" y="17" width="9" height="8" rx="1" fill="#2D9CDB" opacity="0.7"/>
    <rect x="21" y="19" width="7" height="6" rx="1" fill="#2D9CDB" opacity="0.7"/>
    <circle cx="15" cy="27" r="2" fill="#2D9CDB"/>
    <circle cx="25" cy="27" r="2" fill="#2D9CDB"/>
    <text x="40" y="18" font-family="Poppins, sans-serif" font-size="8.5" font-weight="600" fill="#1E293B">Dalam Perjalanan</text>
    <text x="40" y="30" font-family="Poppins, sans-serif" font-size="7.5" fill="#64748B">Estimasi 30 menit</text>
  </g>

  <!-- Placeholder label -->
  <rect x="0" y="560" width="480" height="36" rx="0" fill="rgba(45,156,219,0.06)"/>
  <text x="240" y="582" text-anchor="middle"
        font-family="Poppins, sans-serif" font-size="11" fill="#2D9CDB" font-weight="500">
    [PLACEHOLDER] hero/hero-mockup-main.svg — Ganti dengan ilustrasi final
  </text>
</svg>
