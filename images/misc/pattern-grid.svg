<!-- ============================================================
     WASHCLUB — misc/pattern-grid.svg
     STATUS:    READY TO USE (tidak perlu diganti)
     SECTION:   How It Works, Plans section background
     RATIO:     Tile 40×40px (repeatable)
     USAGE:     CSS background-image repeat pattern
     CSS:       background-image: url('images/misc/pattern-grid.svg');
                background-repeat: repeat;
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 40 40" width="40" height="40">
  <!-- Horizontal line -->
  <line x1="0" y1="0" x2="40" y2="0"
        stroke="#2D9CDB" stroke-width="0.5" stroke-opacity="0.05"/>
  <!-- Vertical line -->
  <line x1="0" y1="0" x2="0" y2="40"
        stroke="#2D9CDB" stroke-width="0.5" stroke-opacity="0.05"/>
</svg>
